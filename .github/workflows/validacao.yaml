name: Validacao
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.cjs
      - run: python scripts/verificar_publicacao.py
      - name: Auditar dependencias
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --disable-pip --no-deps
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Construir e iniciar demonstracao
        run: |
          python3 scripts/preparar.py
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
      - run: python3 tests/smoke_container.py
      - name: Diagnostico em caso de falha
        if: failure()
        run: docker compose logs --tail=100
      - name: Encerrar ambiente descartavel
        if: always()
        run: docker compose down -v
