worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format minimal '$remote_addr $request_method $uri $status';
    access_log /dev/stdout minimal;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:1m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        limit_conn connections 10;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Sobrescreve valores enviados pelo cliente; o app confia em um proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        location = /login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://app:8099;
        }
        location = /api/fluxo {
            limit_req zone=api burst=5 nodelay;
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://app:8099;
        }
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app:8099;
        }
    }
}
