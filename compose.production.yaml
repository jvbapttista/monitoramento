# Arquivo completo, NÃO sobrepor ao compose.yaml da demonstração.
name: monitoramento
services:
  app:
    build: .
    image: monitoramento:local
    init: true
    restart: unless-stopped
    environment:
      MODO_DEMO: "0"
      COOKIE_SEGURO: "1"
      CONFIAR_PROXY: "1"
      DADOS_PESSOAIS: "0"
      SECRET_KEY_FILE: /run/secrets/session_key
      ZABBIX_TOKEN_FILE: /run/secrets/zabbix_token
      ZABBIX_URL: ${ZABBIX_URL:?Defina uma URL HTTPS no .env}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Defina o domínio no .env},127.0.0.1
      ARQUIVO_CONTAS: /dados/usuarios.json
      PROJETOS_CLIENTE: ${PROJETOS_CLIENTE:-PROJETO-A,PROJETO-B,PROJETO-C}
      BLOCOS: ${BLOCOS:-A=PROJETO-A,PROJETO-B;B=PROJETO-C}
      PREFIXOS_NUVEM: ${PREFIXOS_NUVEM:-CLOUD}
    secrets: [session_key, zabbix_token]
    networks: [aplicacao, saida]
    volumes: [contas:/dados]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["443:8443"]
    networks: [aplicacao]
    depends_on:
      app: {condition: service_healthy}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
secrets:
  session_key: {file: ./.secrets/session_key}
  zabbix_token: {file: ./.secrets/zabbix_token}
volumes:
  contas:
networks:
  aplicacao: {internal: true}
  saida: {}
